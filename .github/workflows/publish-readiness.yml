name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".cargo/config.toml"
      - ".github/actions/**"
      - ".github/workflows/publish-readiness.yml"
      - "scripts/bootstrap_stack.py"
      - "stack.lock.toml"
      - "deny.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      - "justfile"
      - "patches/**"
      - "crates/**"
      - "examples/**"
      - "docs/testing/**"

concurrency:
  group: publish-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap locked sibling stack
        uses: ./.github/actions/bootstrap-stack
        with:
          token: ${{ secrets.BURN_STACK_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: cargo xtask ci publish --keep-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-readiness-artifacts
          path: target/test-artifacts
          if-no-files-found: ignore
